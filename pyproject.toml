[project]
name = "energy-forecasting"
version = "0.1.0"
description = "ML and physical-model forecasting for German electricity market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "ml_forecasting*", "solar_forecasting*"]