name: Publish Combined Dashboard

on:
  schedule:
    - cron: '30 6 * * *'   # daily, after both other workflows' typical run times
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      - name: Run ML forecasting pipeline
        run: python -m ml_forecasting.run_pipeline
        continue-on-error: true  # so it doesn't let one module's failure block the other's dashboard

      - name: Run solar forecasting pipeline
        run: python -m solar_forecasting.run_pipeline
        continue-on-error: true

      - name: Assemble combined site
        run: |
          mkdir -p public

          LATEST_ML=$(ls -1d reports/ml_forecast/*/ 2>/dev/null | sort | tail -n 1)
          if [ -n "$LATEST_ML" ] && [ -f "${LATEST_ML}report.html" ]; then
            cp "${LATEST_ML}report.html" public/ml_forecast.html
          else
            echo "ML report missing"
          fi

          LATEST_SOLAR=$(ls -1d reports/solar_forecast/*/ 2>/dev/null | sort | tail -n 1)
          if [ -n "$LATEST_SOLAR" ] && [ -f "${LATEST_SOLAR}forecast.html" ]; then
            cp "${LATEST_SOLAR}forecast.html" public/solar_forecast.html
          else
            echo "Solar report missing"
          fi

          python -m shared.build_index public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - uses: actions/deploy-pages@v4
        id: deployment